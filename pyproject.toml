[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "json-lite"
version = "1.1.0-alpha"
description = "Memory-efficient JSON processing tools"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "JSON Lite Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "ijson>=3.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "psutil>=5.9",
]

dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "psutil>=5.9",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=5.0",
]

[project.scripts]
jsonlite-extract = "json_lite.cli:main"

[tool.setuptools]
packages = ["json_lite", "tools"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88